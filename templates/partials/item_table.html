<div id="table-section">
    {% if items %}
    <button
        class="contrast"
        hx-delete="/items/all"
        hx-confirm="Are you sure you want to delete ALL items?"
        hx-target="#table-section"
        hx-swap="outerHTML"
    >
        Delete All
    </button>
    {% endif %}
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Description</th>
                <th>Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>
        {% include "partials/item_table_body.html" %}
    </table>
    {% if not items %}
    <p>No items in inventory. Add one above!</p>
    {% endif %}
</div>
