<tr hx-target="closest tr" hx-swap="outerHTML">
    <td>{{ item.id }}</td>
    <td>{{ item.name }}</td>
    <td>{{ item.description or '' }}</td>
    <td>{{ item.quantity }}</td>
    <td>
        <button 
            class="contrast" 
            hx-delete="/items/{{ item.id }}" 
            hx-confirm="Are you sure you want to delete this item?"
            hx-target="closest tr"
            hx-swap="outerHTML"
        >
            Delete
        </button>
    </td>
</tr>
