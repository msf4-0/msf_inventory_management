<tr>
    <td>{{ idx }}</td>
    <td>{{ item.name }}</td>
    <td>{{ item.description or '' }}</td>
    <td>
        <span style="display: inline-flex; align-items: center; gap: 0.25rem;">
            <button
                class="outline"
                hx-post="/items/{{ item.id }}/adjust"
                hx-vals='{"delta": -1}'
                hx-target="#table-section"
                hx-swap="outerHTML"
            >&minus;</button>
            {{ item.quantity }}
            <button
                class="outline"
                hx-post="/items/{{ item.id }}/adjust"
                hx-vals='{"delta": 1}'
                hx-target="#table-section"
                hx-swap="outerHTML"
            >+</button>
        </span>
    </td>
    <td>
        <button
            class="contrast"
            hx-delete="/items/{{ item.id }}"
            hx-confirm="Are you sure you want to delete this item?"
            hx-target="#table-section"
            hx-swap="outerHTML"
        >
            Delete
        </button>
    </td>
</tr>
